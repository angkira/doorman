name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Model-free feature set: no ONNX Runtime download, no models, no camera.
  # ORT-dependent code paths (latency, directory-mode accuracy) are exercised
  # on the owner's host, see docs/bench/README.md.
  FEATURES: --no-default-features --features camera-mock,camera-ffmpeg,preview

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libpam0g-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features camera-mock,camera-ffmpeg,preview -- -D warnings

      - name: Clippy (ORT code paths, load-dynamic, no download)
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features backend-ort-rocm,camera-mock,camera-ffmpeg,preview -- -D warnings

      - name: Test
        # test_video_frame_detection builds a real ML pipeline and needs the ORT backend.
        run: cargo test --locked --workspace $FEATURES -- --skip test_video_frame_detection

      - name: Build doorman-bench
        run: cargo build --locked -p doorman-bench --no-default-features

      - name: Bench smoke on synthetic data
        # Only algorithmic invariants are asserted (in bench/tests/cli.rs, run
        # above). This step additionally exercises the shipped binary end to end.
        run: |
          B=target/debug/doorman-bench
          D="$RUNNER_TEMP/bench-smoke"
          $B synth --out "$D" --seed 1
          $B accuracy --scores "$D/accuracy_scores.csv" --out "$D/report"
          $B liveness --scores "$D/liveness_scores.csv" --out "$D/report"
          test -s "$D/report/accuracy.md"
          test -s "$D/report/liveness_roc.csv"

      - name: Bench latency (needs models and the ort feature)
        run: |
          echo "SKIPPED: latency needs ONNX model files and a doorman-bench build with --features ort."
          echo "CI builds the model-free subset; run 'doorman-bench latency' on a host with models (docs/bench/README.md)."

  ort-typecheck:
    # Type-checks the ORT code paths (cfg feature = "_ort") without linking or
    # downloading ONNX Runtime: backend-ort-rocm uses ort/load-dynamic.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libpam0g-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Type-check the ORT backend (load-dynamic, no download)
        run: >
          cargo check --locked -p doormand --all-targets --no-default-features
          --features backend-ort-rocm,camera-mock,camera-ffmpeg,preview

  shellcheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck all tracked shell scripts
        run: |
          # Select by shebang so extensionless scripts (packaging/, scripts/) are covered.
          git ls-files -z | xargs -0 grep -lZE '^#!.*[/ ](ba)?sh( |$)' | xargs -0 shellcheck

  python:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Byte-compile Python sources
        run: python -m compileall -q src tests

      - name: Test
        run: PYTHONPATH=src python -m pytest tests -q

  deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang dpkg-dev libclang-dev libpam0g-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Debian packaging
        run: bash scripts/check_deb_packaging.sh

      - name: Build Debian package
        run: bash scripts/build_deb.sh

      - name: Inspect package
        run: |
          for deb in target/debian/dist/*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done
