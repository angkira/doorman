name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            dpkg-dev \
            ffmpeg \
            libclang-dev \
            libpam0g-dev \
            pkg-config \
            v4l-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test doormand
        run: cargo test --locked -p doormand

      - name: Validate Debian packaging
        run: bash scripts/check_deb_packaging.sh

      - name: Build Debian package
        run: bash scripts/build_deb.sh

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: doorman-deb
          path: target/debian/dist/*.deb
          if-no-files-found: error

      - name: Upload GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/debian/dist/*.deb --clobber
