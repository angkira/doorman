[package]
name = "doormand"
version.workspace = true
edition.workspace = true

[[bin]]
name = "doormand"
path = "src/main.rs"

# Preview GUI window. Gated by the `preview` feature so the default `cargo build`
# (which enables `preview`) produces it, while `--no-default-features` builds skip
# the egui/eframe dependency tree.
[[bin]]
name = "doorman-preview"
path = "src/bin/doorman_preview.rs"
required-features = ["preview"]

# Friendly CLI to manage the daemon over its IPC socket (enroll/list/remove/
# test/status). Pure std + clap client — links no GUI/camera/ML code paths
# beyond the shared protocol crate, so it builds even with --no-default-features.
[[bin]]
name = "doorman"
path = "src/bin/doorman.rs"

# Depth-liveness SIDECAR. Loads ONLY the Depth-Anything-V2 model on the CPU EP and
# serves depth-relief scores over a Unix socket, so the daemon can run on a GPU EP
# (ROCm/CUDA) WITHOUT co-loading a CPU depth session in-process (that mix SEGVs in
# ORT's global OrtEnv). Built with the CPU `backend-ort` feature; requires `_ort`.
#   cargo build --release --no-default-features \
#     --features backend-ort,camera-v4l2,camera-ffmpeg --bin doorman-depthd
[[bin]]
name = "doorman-depthd"
path = "src/bin/doorman_depthd.rs"
required-features = ["_ort"]

[lib]
name = "doormand"
path = "src/lib.rs"

[dependencies]
doorman-shared = { path = "../shared" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }

# ML backend: ONNX Runtime (ort). The base dependency pulls NO linking strategy;
# each backend feature picks one (see [features]):
#   - backend-ort       -> ort/download-binaries (bundled CPU dylib, zero system deps)
#   - backend-ort-rocm  -> ort/load-dynamic       (dlopen a ROCm libonnxruntime.so)
#   - backend-ort-cuda  -> ort/cuda + download-binaries
# This keeps `download-binaries` and `load-dynamic` from being enabled together
# (which would download a CPU dylib that the ROCm dynamic-load path then ignores).
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }

# ROCm pre-flight only: dlopen libamdhip64 to ask hipGetDeviceCount whether HIP
# sees a usable GPU BEFORE registering the ROCm EP (ORT's ROCm init does an
# uncatchable C++ terminate() when no device is visible). Pulled in by
# backend-ort-rocm; not linked on CPU/CUDA/CoreML builds.
libloading = { version = "0.8", optional = true }

# CPU array/parallel helpers used by preprocessing
rayon = "1.10"
# 0.17 matches what ort 2.0.0-rc.12 depends on (it re-exports ndarray tensor
# conversions); doorman has no direct ndarray usage so this is a unification bump.
ndarray = { version = "0.17", features = ["rayon"] }

# Camera backends (Linux-gated except the cross-platform nokhwa webcam dev path)
gstreamer = { version = "0.22", optional = true }
gstreamer-app = { version = "0.22", optional = true }
glib = { version = "0.19", optional = true }
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# Image processing
image = "0.25"
base64 = "0.22"

# Preview GUI (doorman-preview bin, behind `preview` feature)
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

# Embedding storage
bincode = "1.3"

# Signal handling
tokio-util = "0.7"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
futures = "0.3"

# Permissions
nix = { version = "0.31", features = ["user", "fs"] }

# Timestamps
chrono = "0.4"

# Async D-Bus client (systemd-logind lock supervisor + proactive unlock).
# Pinned to 4.4 to reuse the version already in the lockfile (pulled transitively
# by eframe/accesskit in the default build). `default-features = false` + `tokio`
# routes zbus onto the existing tokio reactor instead of its async-io default, so
# it shares the daemon's runtime in the --no-default-features ROCm build too.
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

[features]
# Default dev/preview build: CPU ONNX Runtime + cross-platform mock camera +
# the dependency-free ffmpeg live-webcam path. Works on macOS and inside an
# Ubuntu container with no Rust system deps (ffmpeg is an optional runtime CLI;
# the camera layer falls back to mock when it is missing).
default = ["backend-ort", "camera-mock", "camera-ffmpeg", "preview"]

# --- ML backends ---
# NOTE: ort 2.0.0-rc.12 split TLS out of `download-binaries` — any feature that
# downloads the bundled ONNX Runtime must now explicitly enable exactly one TLS
# provider, else ort-sys emits a compile_error!. We pick `tls-rustls` (ring) to
# avoid a system OpenSSL dependency, keeping the Ubuntu container / CI builds
# dependency-free as documented below.
# Internal marker: enabled by EVERY backend-ort-* feature so the ORT backend
# module tree (gated on `feature = "_ort"`) compiles regardless of which EP / link
# strategy is selected. Kept separate from `backend-ort` so the load-dynamic
# (ROCm) path does NOT inherit `download-binaries`.
_ort = []
backend-ort = ["_ort", "ort", "ort/download-binaries", "ort/tls-rustls"]           # CPU (bundled ONNX Runtime), all platforms
# An `ort/api-N` feature is required on the load-dynamic path:
# rc.12's always-compiled `ep/vitis.rs` references an `api-18`-gated OrtApi field,
# and `load-dynamic` (disable-linking) does not pull any `api-*` feature in by
# itself, so without this the ort crate fails to compile. The statically-linked
# `download-binaries` path provides the field unconditionally and does not need it.
# ROCm note: The ROCm EP was removed from ORT 1.23.0 onward. We build ORT 1.22.x
# (the last version with the ROCm EP) which implements up to api-22. Using api-24
# would call GetApi(24) which returns NULL on a 1.22.x .so, causing a crash.
# api-22 is cumulative (includes api-18..api-21) so it satisfies all compile requirements.
backend-ort-rocm = ["_ort", "ort", "ort/load-dynamic", "ort/api-22", "dep:libloading"]           # AMD ROCm EP (dlopen libonnxruntime.so); api-22 targets ORT 1.22.x (ROCm EP was removed in ORT 1.23.0; api-24 would crash against a 1.22.x .so)
backend-ort-cuda = ["_ort", "ort", "ort/cuda", "ort/download-binaries", "ort/tls-rustls", "ort/api-24"] # NVIDIA CUDA EP, Linux only
# Apple-Silicon acceleration: CoreML EP (Neural Engine / GPU / CPU). macOS only.
# The bundled ONNX Runtime from `download-binaries` ships with CoreML support, so
# this just turns on the `ort/coreml` API + on-device registration. Opt-in:
#   cargo build --features backend-ort-coreml
# Enabling `ort/coreml` is a no-op on non-Apple platforms (the EP refuses to
# register via `supported_by_platform()`), so the flag is harmless if mis-set,
# but it is intended for macOS only — Linux uses backend-ort-rocm / -cuda.
# Pulls in `backend-ort` (the full CPU backend module tree + bundled ONNX
# Runtime) and additionally turns on the CoreML EP API, so every
# `#[cfg(feature = "backend-ort")]` code path stays compiled and CoreML is a
# pure add-on with CPU fallback baked in.
backend-ort-coreml = ["backend-ort", "ort/coreml"] # CoreML EP (ANE/GPU/CPU), macOS only

# ncnn + Vulkan iGPU backend (Linux only). PHASE 1 = FFI foundation: compiles
# the C++ shim (ncnn_shim/) in build.rs and links a static libncnn built with
# -DNCNN_VULKAN=ON (prefix via DOORMAN_NCNN_DIR, default /tmp/ncnn_install).
# Additive + standalone: it does NOT pull any ort/backend-ort* feature, so the
# default and ROCm builds are untouched when this is off. Wiring into MLBackend
# (the hybrid that keeps EdgeFace on ORT-CPU) is PHASE 2.
#   cargo build --no-default-features --features backend-ncnn,camera-v4l2,camera-ffmpeg
backend-ncnn = []

# --- Camera backends ---
camera-mock = []                                         # video-file / synthetic frames, all platforms
camera-ffmpeg = []                                       # live webcam via ffmpeg CLI (macOS AVFoundation / Linux V4L2)
camera-v4l2 = ["nokhwa"]                                 # V4L2 via nokhwa, Linux only
camera-gstreamer = ["gstreamer", "gstreamer-app", "glib"]# GStreamer/PipeWire, Linux only
camera-nokhwa = ["nokhwa"]                               # native webcam (AVFoundation/MSMF/V4L2)

# --- Preview window (doorman-preview bin, built in M3) ---
preview = ["eframe", "egui"]

# The raw-nokhwa probe example only builds when the nokhwa webcam backend is enabled.
[[example]]
name = "camera_test"
required-features = ["camera-nokhwa"]

# CPU vs CoreML benchmark + node-placement report (Apple Silicon).
[[example]]
name = "coreml_bench"
required-features = ["backend-ort-coreml"]

# ncnn-Vulkan iGPU FFI proof (PHASE 1): loads converted YuNet + Depth-Anything
# .param/.bin, runs them on the integrated RADV PHOENIX device, and prints the
# selected device + output stats. Only builds with backend-ncnn.
[[example]]
name = "ncnn_igpu"
required-features = ["backend-ncnn"]

# THROWAWAY Phase-4 security validation: compares ncnn-iGPU depth_relief vs
# ORT-CPU depth_relief on genuine/spoof images for the FATAL anti-spoof gate.
# Needs both the ORT (inner backend + reference) and ncnn (iGPU depth) features.
[[example]]
name = "ncnn_hybrid_validate"
required-features = ["backend-ort", "backend-ncnn"]

# `cc` compiles the ncnn C++ shim — but ONLY when backend-ncnn is enabled (the
# build.rs gates all native work behind that feature, so this dep is inert for
# the default / ORT / ROCm builds even though it is always present here).
[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.13"
tokio-test = "0.4"
approx = "0.5.1"
toml = "1.0"
